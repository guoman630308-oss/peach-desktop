<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 私人馆藏不进搜索结果。响应头 X-Robots-Tag 管所有响应，这一行管只读 HTML 的爬虫。 -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" data-theme-color="light">
<meta name="theme-color" content="#080A0D" media="(prefers-color-scheme: dark)" data-theme-color="dark">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<title>Peach · 蜜桃</title>
<!-- React 子树（BoardUI 源码 + Tailwind）排在旧样式表前面：`:root` 上同名的 `--color-*` token
     由后面的 board.css 定值，未迁移页面的颜色不受这份样式影响；React 子树在 `.peach-react`
     容器上重新声明上游值。 -->
<link rel="stylesheet" href="/dist/peach-app.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/board.css">
<!-- 主题必须在第一次绘制之前定下来。主入口是 module，等同 defer：轮到它跑的时候
     浏览器已经按系统色画过一帧，手动选了浅色的人每次进页面都要先看一下深色。
     这段只做三件事——按实际深浅给 <html> 加减 `dark` 类、把选择写到 data-theme、
     把地址栏色块切到同一档；色板只在 web/css/01-base.css 一份，切换逻辑只在 appearance/theme.ts 的
     applyTheme() 一份。 -->
<script>
if(location.pathname==='/wall')document.documentElement.setAttribute('data-wall-entry','');
(()=>{try{
  document.documentElement.classList.toggle('board-high-contrast',localStorage.getItem('peach.high-contrast')==='true');
  const choice=JSON.parse(localStorage.getItem('peach.settings.v1')||'{}').theme;
  document.documentElement.classList.toggle('dark',choice==='dark'||(choice!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches));
  if(choice!=='light'&&choice!=='dark')return;
  document.documentElement.dataset.theme=choice;
  document.querySelectorAll('meta[data-theme-color]').forEach(meta=>{
    meta.media=meta.dataset.themeColor===choice?'all':'not all';
  });
}catch(_e){}})();
</script>
</head>

<header class="top">
  <button class="ib" id="filterBtn" title="导航与筛选" aria-label="展开导航与筛选"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-panel-left"/></svg></button>
  <a class="brand" href="#" id="brandHome"><img class="mark" src="/peach-logo.png" alt=""><h1 class="disp">Peach</h1><span class="sub mono">蜜桃</span></a>
  <button class="ib searchback" id="searchBack" title="退出搜索" aria-label="退出搜索"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
  <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
    <input id="q" name="q" type="search" enterkeyhint="search" placeholder="搜索馆藏" data-suggestion="" autocomplete="off" aria-label="搜索作品、女优、厂牌或标签">
    <div class="searchmenu" id="searchMenu" data-search-menu hidden></div></div>
  <button class="ib" id="searchBtn" title="搜索" aria-label="搜索"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg></button>
  <button class="ib" id="immerseBtn" title="沉浸模式 · 随机连播" aria-label="进入沉浸模式"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-play"/></svg></button>
  <button class="ib" id="wallBtn" title="播放墙" aria-label="进入播放墙"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-gallery-thumbnails"/></svg></button>
  <button class="ib" id="selectMode" title="多选（Ctrl 单项，Shift 连续）" aria-label="多选模式" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-square-check-big"/></svg></button>
  <button class="ib" id="density" title="密度：大图 / 密集" aria-label="切换卡片密度"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-layout-grid"/></svg></button>
  <button class="ib" id="settingsBtn" title="设置" aria-label="打开设置"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"/></svg></button>

</header>

<!-- 首页筛选条（`catalog-filter` 岛）：两排头像与筛选浮层。宿主不生成盒子，里面那几块直接当 body 的孩子排。 -->
<div id="catalogPageHeading" hidden><h2 class="disp" data-page-title>首页</h2></div>
<div id="javLibraryHeader" class="peach-react" hidden></div>
<h2 class="disp listtitle" id="listTitle" hidden></h2>
<div id="catalogFilter" data-catalog-filter></div>

<main id="main" tabindex="-1">
  <aside id="catalogFoldersTree" class="peach-react" hidden></aside>
  <div id="catalogFolderHeader" class="peach-react" hidden></div>
  <!-- 订阅源发现的新作（ADR-0042）。只在首页那几条目录路径上出现，由应用控制器按路径开合。 -->
  <section class="feednew" id="feedNew" aria-label="未入库的新作" hidden></section>
  <div id="combo"></div>
  <section class="index" id="index" hidden></section>
  <!-- 管理条、面包屑、标题与说明行是常驻组件 manage-header（`frontend/src/react/manage-header/`），由路由树画进这个节点。 -->
  <div data-manage-header></div>
  <section class="stats" id="stats" hidden></section>
  <div class="count mono" id="count" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="gridstack" id="grid"></div>
  <div class="loadmore mono" id="loadSentinel" hidden></div>
</main>

<section id="postSetupTutorial" aria-label="Peach 安装教程" aria-live="polite" hidden></section>

<div id="scrim" data-sidebar-scrim></div>
<!-- 左侧抽屉：滚动层是常驻组件 sidebar（`react/sidebar/`），由路由树画进 #drawerScroll；抽屉本身、覆盖式滚动条与底栏归壳。
     光晕就是侧栏玻璃面上那两团慢慢漂的光换成用户自己配的三枚，所以它长在抽屉里面、
     跟着抽屉的圆角一起被裁，正文身后一点都没有。单独占一层是因为失效范围：光晕参数是
     自定义属性，写在 <html> 上等于让整棵树重算样式，拖一次强度拉条每帧要赔十几毫秒；
     写在这枚没有子节点的空 div 上，失效范围就只剩它和它那两枚伪元素。
     怎么画仍然只在 web/css/01-base.css 一份。 -->
<aside id="drawer" data-sidebar-drawer><div class="glowlayer" aria-hidden="true"></div><div id="drawerScroll" data-sidebar-scroll></div></aside>
<!-- 批量条是常驻组件 batch-dock（`frontend/src/react/batch-dock/`），由路由树画进这个节点；选中集与写操作留在壳里。 -->
<div data-batch-dock></div>

<div id="toasts"></div>

<!-- Video.js 10 的本地 ESM 模块由 player/videojs.ts 在首次挂播放器时加载。 -->
<div id="appRoot"></div>
