name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Windows runner 的 stdout 默认按本机 ANSI（cp1252）编码，而项目里的脚本和错误
# 消息大量是中文——`print(f"首尾帧审计失败：{error}")` 在 runner 上直接抛
# UnicodeEncodeError，15 个脚本类用例因此全红，本地却全绿。
#
# `tests/test_subprocess_encoding.py` 已经把这条口径写死过一次：「由 Peach 控制的
# 子进程还必须用 PYTHONIOENCODING=utf-8 固定输出端」。CI 缺的正是这一层——那条
# 测试管的是源码里怎么调 subprocess，管不到 runner 自己的 stdout。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  workflow-lint:
    name: Actions 工作流静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/actionlint

  plan:
    needs: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      wheel_matrix: ${{ steps.plan.outputs.wheel_matrix }}
      wide: ${{ steps.plan.outputs.wide }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
      browser: ${{ steps.plan.outputs.browser }}
      frontend: ${{ steps.plan.outputs.frontend }}
      vendor: ${{ steps.plan.outputs.vendor }}
      wheel: ${{ steps.plan.outputs.wheel }}
      required_jobs: ${{ steps.plan.outputs.required_jobs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: 生成验证矩阵
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: uv run --locked --python 3.14 scripts/ci_plan.py --event "$EVENT_NAME" --base "$BASE_SHA"

  frontend-ready:
    name: 前端检查结果
    needs: [plan, web-bundle, web-vendor]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 所选前端检查均成功
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUIRED_JOBS: ${{ needs.plan.outputs.required_jobs }}
        run: python scripts/ci_plan.py --verify-results --phase frontend

  wheel-build:
    needs: [plan, frontend-ready]
    if: ${{ !cancelled() && needs.frontend-ready.result == 'success' && needs.plan.outputs.wheel == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv build --wheel --out-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-smoke
          if-no-files-found: error
          retention-days: 7
          path: |
            wheelhouse/*.whl
            scripts/smoke_wheel.py
  wheel-smoke:
    name: wheel 最小安装 / ${{ matrix.os }} / ${{ matrix.python }}
    needs: [plan, wheel-build]
    if: ${{ !cancelled() && needs.wheel-build.result == 'success' && needs.plan.outputs.wheel == 'true' }}
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.wheel_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheel-smoke
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: 安装正式 wheel
        shell: bash
        run: |
          python -m pip install --no-cache-dir wheelhouse/*.whl
          python -m pip check
      - name: 源码树外冒烟
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"
  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.scope }} / ${{ matrix.shard_index }}
    needs: [plan, frontend-ready]
    if: ${{ !cancelled() && needs.frontend-ready.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # `web` 与 `packaging` 域里的 tsc、lint、vitest 和浏览器冒烟在 CI 缺前置条件时判失败
      # （`tests/support/conditions.py`）。`core` 不含这些用例，其余域都要装齐。
      - uses: actions/setup-node@v7
        if: matrix.scope != 'core'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖
        if: matrix.scope != 'core'
        run: npm --prefix frontend ci
      # 抽帧与 AV1 软件解码回归在两端执行；浏览器冒烟的 Chrome 仅在 Windows 装配。
      - name: 安装固定版本 FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        if: runner.os == 'Windows' && matrix.scope != 'core'
        with:
          ffmpeg-version: "9.0.1"
          github-token: ${{ github.token }}
      - name: 安装 macOS FFmpeg
        if: runner.os == 'macOS' && matrix.scope != 'core'
        run: brew install ffmpeg
      - name: 指定 e2e 用的 Chrome
        if: runner.os == 'Windows' && matrix.scope != 'core'
        shell: pwsh
        run: |
          $peachChrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path -LiteralPath $peachChrome)) { throw "runner 上没有 Chrome：$peachChrome" }
          "PEACH_E2E_CHROME=$peachChrome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: 安装 Windows 依赖
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv sync --locked --all-extras --python python
          if ($LASTEXITCODE -ne 0) { throw 'uv 锁定安装失败' }
          uv pip check --python .venv/Scripts/python.exe
          if ($LASTEXITCODE -ne 0) { throw 'uv 依赖检查失败' }
      - name: 运行 Windows 正式测试
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          & .\scripts\test.ps1 -Scope ${{ matrix.scope }} -Fresh -Base $env:BASE_SHA -ShardIndex ${{ matrix.shard_index }} -ShardCount ${{ matrix.shard_count }} *>&1 | Tee-Object -FilePath build/ci-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Python 分片未通过，详见 ci-tests.log' }
      - name: 安装 macOS 依赖
        if: runner.os == 'macOS'
        shell: bash
        run: |
          uv sync --locked --all-extras --python python
          uv pip check --python .venv/bin/python
      - name: 运行 macOS 正式测试
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p build
          ./scripts/test.sh ${{ matrix.scope }} --fresh --base "$BASE_SHA" --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }} 2>&1 | tee build/ci-tests.log
      - name: 保存分片测试日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.os }}-${{ matrix.scope }}-${{ matrix.shard_index }}
          path: build/ci-tests.log
          if-no-files-found: ignore
          retention-days: 14

  web-bundle:
    name: island 产物与前端测试
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - name: 前端文案
        run: npm --prefix frontend run check:copy
      - name: 前端 lint 与扫描范围
        run: |
          npm --prefix frontend run lint --silent -- --format=json > frontend-lint.json
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import assert from "node:assert/strict"; const report = JSON.parse(readFileSync("frontend-lint.json", "utf8")); assert.deepEqual(report.diagnostics, []); assert.ok(report.number_of_files > 0, "lint 必须扫描文件");'
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      # 产物提交进 Git，因为运行时和打包都没有 Node（ADR-0022）。一旦源码改了却忘了
      # 重新构建并提交，服务端发出去的就还是旧 island——本地跑测试也看不出来，只有
      # 在这里比一次才拦得住。
      #
      # 先 `git add -N`：光 `git diff` 只看已跟踪的文件，构建新出的产物（某个 island
      # 开始带自己的 CSS 就会多一份 peach-ui.css）是未跟踪的，那条门槛会直接放过去。
      - name: 核对 web/dist 与源码一致
        run: |
          git add --intent-to-add -- web/dist
          git diff --exit-code --stat -- web/dist
      - name: npm audit (frontend)
        run: python scripts/npm_audit.py --prefix frontend

  # 每片拥有独立服务与演示库；文件内的浏览器交互保持串行。
  web-e2e:
    name: 浏览器回归 / ${{ matrix.index }}
    needs: [plan, frontend-ready]
    if: ${{ !cancelled() && needs.frontend-ready.result == 'success' && needs.plan.outputs.browser == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.browser_matrix) }}
    env:
      BROWSER_FILES: ${{ matrix.files }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: 安装固定版本 FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: "9.0.1"
          github-token: ${{ github.token }}
      - name: 指定 e2e 用的 Chrome
        shell: pwsh
        run: |
          $peachChrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path -LiteralPath $peachChrome)) { throw "runner 上没有 Chrome：$peachChrome" }
          "PEACH_E2E_CHROME=$peachChrome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: 安装 Python 依赖
        shell: pwsh
        run: |
          uv sync --locked --all-extras --python python
          if ($LASTEXITCODE -ne 0) { throw 'uv 锁定安装失败' }
      - name: 运行本片浏览器用例
        shell: pwsh
        run: |
          $peachBrowserFiles = @($env:BROWSER_FILES | ConvertFrom-Json)
          & .\scripts\test.ps1 -Scope web -Focus $peachBrowserFiles
          if ($LASTEXITCODE -ne 0) { throw '浏览器分片未通过' }
      - name: 保存浏览器测试日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.index }}
          path: |
            build/agent-verification/browser/*.tap
            build/agent-verification/browser/serve.log
            build/agent-verification/browser/setup-serve.log
            build/agent-verification/browser/network/*.json
          if-no-files-found: ignore
          retention-days: 14

  web-vendor:
    name: 固定前端依赖
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.vendor == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:vendor
      - name: npm audit
        run: python scripts/npm_audit.py

  verified:
    name: 完整验证结果
    if: always()
    needs: [plan, workflow-lint, frontend-ready, python, wheel-build, wheel-smoke, web-bundle, web-e2e, web-vendor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 所有必需任务均成功
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUIRED_JOBS: ${{ needs.plan.outputs.required_jobs }}
        run: python scripts/ci_plan.py --verify-results
